~_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinelx-backend-net

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sentinelx-backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-backend
    restart: always
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-SentinelX EDR}
      VERSION: ${VERSION:-"1.0.0"}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinelx}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-""}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${JWT_SECRET:-${SECRET_KEY:-change-this-to-a-secure-random-secret-key-in-production}}
      JWT_SECRET: ${JWT_SECRET:-${SECRET_KEY:-change-this-to-a-secure-random-secret-key-in-production}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@sentinelx.io}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeAdminPass2026!}
      INITIAL_ANALYST_EMAIL: ${INITIAL_ANALYST_EMAIL:-analyst@sentinelx.io}
      INITIAL_ANALYST_PASSWORD: ${INITIAL_ANALYST_PASSWORD:-ChangeAnalystPass2026!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sentinelx-backend-net
      - sentinelx-frontend-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-worker
    restart: always
    command: python -m app.worker
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-"SentinelX EDR"}
      VERSION: ${VERSION:-"1.0.0"}
      API_V1_STR: ${API_V1_STR:-"/api/v1"}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinelx}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-""}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${JWT_SECRET:-${SECRET_KEY:-change-this-to-a-secure-random-secret-key-in-production}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelx-backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelx-frontend-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sentinelx-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --no-check-certificate https://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelx-frontend-net

networks:
  sentinelx-frontend-net:
    driver: bridge
  sentinelx-backend-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: