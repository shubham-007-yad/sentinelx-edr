name: SentinelX EDR CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

env:
  ENVIRONMENT: test
  LOG_LEVEL: INFO
  JWT_SECRET: sentinelx-edr-super-secret-key-2026-production-ready
  POSTGRES_USER: sentinel
  POSTGRES_PASSWORD: sentinelpassword
  POSTGRES_DB: sentinelx
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  REDIS_HOST: localhost
  REDIS_PORT: 6379

jobs:

  # ------------------------------------------------------------------
  # Job 1: Backend Unit & Integration Tests
  # ------------------------------------------------------------------
  backend-tests:
    name: 🐍 Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinelpassword
          POSTGRES_DB: sentinelx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://sentinel:sentinelpassword@localhost:5432/sentinelx
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          PYTHONPATH=. pytest tests/

  # ------------------------------------------------------------------
  # Job 2: Agent Engine Unit & Integration Tests
  # ------------------------------------------------------------------
  agent-tests:
    name: 🛡️ Agent Engine Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Agent & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt -r backend/requirements.txt pytest

      - name: Run Agent Pytest Suite
        run: |
          cd agent
          PYTHONPATH=. pytest tests/

  # ------------------------------------------------------------------
  # Job 3: Frontend TypeScript & Vite Production Build
  # ------------------------------------------------------------------
  frontend-build:
    name: ⚛️ Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Execute TypeScript Compiler & Vite Production Build
        run: |
          cd frontend
          npm run build

  # ------------------------------------------------------------------
  # Job 4: Automated Security Checks
  # ------------------------------------------------------------------
  security-checks:
    name: 🔒 Security & RBAC Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinelpassword
          POSTGRES_DB: sentinelx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest bandit

      - name: Run Python Security Static Analysis (Bandit)
        run: |
          bandit -r backend/app agent/ -ll -ii --skip B101 || true

      - name: Execute Security & RBAC Test Suite
        env:
          DATABASE_URL: postgresql://sentinel:sentinelpassword@localhost:5432/sentinelx
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          PYTHONPATH=. pytest tests/test_security_suite.py

  # ------------------------------------------------------------------
  # Job 5: Docker Container Build & Deployment Validation Probe
  # ------------------------------------------------------------------
  docker-build-and-validate:
    name: 🐳 Docker Build & Deployment Validation
    needs: [backend-tests, agent-tests, frontend-build, security-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Self-Signed TLS Certificates for Nginx
        run: |
          chmod +x nginx/generate_certs.sh
          ./nginx/generate_certs.sh

      - name: Build Docker Container Stack
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Spin up EDR Production Stack
        run: |
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for Stack Healthiness & Run Deployment Probes
        run: |
          echo "Waiting 20s for containers to initialize..."
          sleep 20
          docker compose -f docker-compose.prod.yml ps
          
          echo "Testing Liveness Probe (/health)..."
          curl --fail -k https://localhost/api/v1/health || curl --fail http://localhost:8000/health
          
          echo "Testing Readiness Probe (/ready)..."
          curl --fail -k https://localhost/api/v1/ready || curl --fail http://localhost:8000/ready

      - name: Tear Down Container Stack
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v
