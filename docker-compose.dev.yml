name: sentinelx-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sentinelx-backend-net

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis-dev
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sentinelx-backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-backend-dev
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-SentinelX EDR}
      VERSION: ${VERSION:-"1.0.0"}
      API_V1_STR: ${API_V1_STR:-"/api/v1"}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinelx}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-""}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${JWT_SECRET:-${SECRET_KEY:-dev-secret-key-sentinelx-2026}}
      JWT_SECRET: ${JWT_SECRET:-${SECRET_KEY:-dev-secret-key-sentinelx-2026}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@sentinelx.io}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminPassword123!}
      INITIAL_ANALYST_EMAIL: ${INITIAL_ANALYST_EMAIL:-analyst@sentinelx.io}
      INITIAL_ANALYST_PASSWORD: ${INITIAL_ANALYST_PASSWORD:-AnalystPassword123!}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sentinelx-backend-net
      - sentinelx-frontend-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-worker-dev
    restart: unless-stopped
    command: python -m app.worker
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-SentinelX EDR}
      VERSION: ${VERSION:-"1.0.0"}
      API_V1_STR: ${API_V1_STR:-"/api/v1"}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinelx}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-""}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${JWT_SECRET:-${SECRET_KEY:-dev-secret-key-sentinelx-2026}}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelx-backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sentinelx-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sentinelx-frontend-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sentinelx-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelx-frontend-net

networks:
  sentinelx-frontend-net:
    driver: bridge
  sentinelx-backend-net:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
